<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng - Đề thi Y khoa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0056b3;
      margin-top: 0;
    }
    .stats-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      flex: 1;
      padding: 15px;
      background: #eef2f7;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card h3 {
      margin: 0 0 5px 0;
      font-size: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      font-weight: bold;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-admin { background-color: #d1ecf1; color: #0c5460; }
    .badge-user { background-color: #e2e3e5; color: #383d41; }
    .badge-approved { background-color: #d4edda; color: #155724; }
    .badge-pending { background-color: #fff3cd; color: #856404; }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-right: 5px;
    }
    .btn-approve { background-color: #28a745; color: white; }
    .btn-delete { background-color: #dc3545; color: white; }
    .btn:hover { opacity: 0.85; }
    .loading-text {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Danh sách Quản lý Người dùng & Người duyệt</h2>
    
    <div class="stats-bar">
      <div class="stat-card">
        <h3 id="count-total">0</h3>
        <span>Tổng thành viên</span>
      </div>
      <div class="stat-card">
        <h3 id="count-admin">0</h3>
        <span>Admin (Quản trị)</span>
      </div>
      <div class="stat-card">
        <h3 id="count-pending">0</h3>
        <span>Chờ duyệt</span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>STT</th>
          <th>Tên / Email</th>
          <th>Vai trò (Role)</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <tr>
          <td colspan="5" class="loading-text">Đang đồng bộ dữ liệu hệ thống...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- SCRIPT XỬ LÝ FIREBASE ĐƯỢC BỌC ĐÚNG CHUẨN MODULE -->
  <script type="module">
    import { db } from './firebase-config.js';
    import { 
      collection, 
      doc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // 1. LẮNG NGHE ĐỒNG BỘ DỮ LIỆU THỜI GIAN THỰC (TỐC ĐỘ CAO KHÔNG LỖI)
    function startUsersListener() {
      const usersRef = collection(db, 'users_list');

      onSnapshot(usersRef, (snapshot) => {
        const allUsers = snapshot.docs.map((docSnap) => ({
          id: docSnap.id,
          ...docSnap.data()
        }));

        // Bóc tách Admin và Pending ngay trên bộ nhớ RAM
        const admins = allUsers.filter(u => u.role === 'admin');
        const pendingUsers = allUsers.filter(u => u.status === 'pending');

        // Cập nhật con số thống kê
        document.getElementById('count-total').innerText = allUsers.length;
        document.getElementById('count-admin').innerText = admins.length;
        document.getElementById('count-pending').innerText = pendingUsers.length;

        // Vẽ bảng danh sách ra giao diện
        renderTable(allUsers);
      }, (error) => {
        console.error("Lỗi kết nối Firestore:", error);
        document.getElementById('users-table-body').innerHTML = `
          <tr><td colspan="5" style="color:red; text-align:center;">Lỗi tải dữ liệu: ${error.message}</td></tr>
        `;
      });
    }

    // 2. VẼ BẢNG DỮ LIỆU BẢO TOÀN TÀI KHOẢN ADMIN
    function renderTable(users) {
      const tbody = document.getElementById('users-table-body');
      
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Chưa có dữ liệu người dùng</td></tr>';
        return;
      }

      let html = '';
      users.forEach((user, index) => {
        const roleBadge = user.role === 'admin' 
          ? '<span class="badge badge-admin">Admin</span>' 
          : '<span class="badge badge-user">User</span>';
        
        const statusBadge = user.status === 'pending'
          ? '<span class="badge badge-pending">Chờ duyệt</span>'
          : '<span class="badge badge-approved">Đã duyệt</span>';

        const approveBtn = user.status === 'pending' 
          ? `<button class="btn btn-approve" data-id="${user.id}" data-action="approve">Phê duyệt</button>` 
          : '';

        const deleteBtn = `<button class="btn btn-delete" data-id="${user.id}" data-action="delete">Xóa</button>`;

        html += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${user.email || user.username || user.name || user.id}</strong></td>
            <td>${roleBadge}</td>
            <td>${statusBadge}</td>
            <td>
              ${approveBtn}
              ${deleteBtn}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // 3. HÀM PHÊ DUYỆT TÀI KHOẢN
    async function handleApprove(userId) {
      try {
        const userRef = doc(db, 'users_list', userId);
        await updateDoc(userRef, { status: 'approved' });
      } catch (error) {
        alert("Lỗi khi phê duyệt: " + error.message);
      }
    }

    // 4. HÀM XÓA TÀI KHOẢN (RÁC / MẪU)
    async function handleDelete(userId) {
      if (!confirm("Bác có chắc chắn muốn xóa tài khoản này không?")) return;
      try {
        const userRef = doc(db, 'users_list', userId);
        await deleteDoc(userRef);
      } catch (error) {
        alert("Lỗi khi xóa: " + error.message);
      }
    }

    // 5. GẮN SỰ KIỆN SỰ CỐ ĐÚNG CHUẨN ĐỂ CLICK NÚT KHÔNG LỖI
    document.getElementById('users-table-body').addEventListener('click', (e) => {
      const target = e.target;
      const action = target.getAttribute('data-action');
      const userId = target.getAttribute('data-id');

      if (action === 'approve') {
        handleApprove(userId);
      } else if (action === 'delete') {
        handleDelete(userId);
      }
    });

    // Chạy đồng bộ ngay khi trang load xong
    startUsersListener();
  </script>
</body>
</html>
